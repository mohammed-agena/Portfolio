 <section class="hero" id="top" style="border:0"><div class="wrap hero-grid"><div class="hero-copy"><p class="eyebrow">${esc(tr(SITE.status))}</p><h1>${lang==='ar'?'محمد <span class="accent">عجينة</span>':'Mohamed <span class="accent">Agena</span>'}</h1><p class="role">${esc(tr(SITE.role))}</p><p class="intro">${esc(tr(SITE.intro))}</p><div class="actions"><a class="btn primary" href="mailto:mohammedag.dev@gmail.com">${esc(t.email)} ↗</a><a class="btn" href="https://github.com/mohammed-agena" target="_blank" rel="noopener noreferrer">GitHub ↗</a><a class="btn" href="#projects">${esc(t.navProjects)} ↓</a></div><p class="micro">${lang==='en'?'Based in Dakahlia, Egypt · Interested in practical learning and collaboration':'مقيم في الدقهلية، مصر · مهتم بالتطبيق العملي والتعاون'}</p></div><div class="visual" aria-label="Portrait area"><div class="orbit"></div><div class="orbit two"></div><div class="portrait">${portrait}<div class="placeholder" style="${SITE.photo?'display:none':''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 21c.6-4.2 3.1-6.5 7.5-6.5s6.9 2.3 7.5 6.5"/></svg>${t.photo}<br>${t.photoHelp}</div></div><div class="float-card fc1">⌘ &nbsp; AI · Data · Code</div><div class="float-card fc2"><span class="fc-dot"></span>${lang==='en'?'Learning by building':'بتعلم بالتطبيق'}</div></div></div></section>
 <section id="about"><div class="wrap reveal"><div class="section-top"><div><p class="kicker">${t.aboutK}</p><h2 class="section-title">${t.aboutTitle}</h2></div></div><div class="about-grid"><p class="bio">${esc(tr(SITE.bio))}</p><dl class="facts">${SITE.facts.map(f=>`<div class="fact"><dt>${esc(tr(f[0]))}</dt><dd>${esc(tr(f[1]))}</dd></div>`).join('')}</dl></div></div></section>
 <section id="skills"><div class="wrap reveal"><div class="section-top"><div><p class="kicker">${t.skillsK}</p><h2 class="section-title">${t.skillsTitle}</h2><p class="section-desc">${t.skillsDesc}</p></div></div><div class="skills-grid">${SKILLS.map(s=>`<article class="skill-card"><div class="card-head"><div class="symbol">${esc(s.icon)}</div><h3>${esc(tr(s.title))}</h3></div><div class="chips">${s.items.map(([name,state])=>`<span class="chip ${state}">${esc(name)}</span>`).join('')}</div></article>`).join('')}</div><div class="legend"><span><i></i>${t.legendFoundation}</span><span><i class="l2"></i>${t.legendLearning}</span></div></div></section>
 <section id="services"><div class="wrap reveal"><div class="section-top"><div><p class="kicker">${t.servicesK}</p><h2 class="section-title">${t.servicesTitle}</h2><p class="section-desc">${t.servicesDesc}</p></div></div><div class="services-grid">${SERVICES.map(s=>`<article class="service-card"><h3>${esc(tr(s.title))}</h3><p>${esc(tr(s.desc))}</p><span class="status learning">${t.learning}</span></article>`).join('')}</div></div></section>
 <section id="projects"><div class="wrap reveal"><div class="section-top"><div><p class="kicker">${t.projectsK}</p><h2 class="section-title">${t.projectsTitle}</h2><p class="section-desc">${t.projectsDesc}</p></div></div>${PROJECTS.length?`<div class="projects-grid">${PROJECTS.map(p=>`<article class="project-card"><span class="project-type">${esc(tr(p.type))}</span><h3>${esc(tr(p.title))}</h3><p>${esc(tr(p.desc))}</p><div class="chips"><span class="chip">${esc(p.stack||'')}</span></div><div class="project-links">${p.code?`<a href="${esc(p.code)}" target="_blank" rel="noopener noreferrer">${lang==='en'?'View code ↗':'عرض الكود ↗'}</a>`:''}${p.demo?`<a href="${esc(p.demo)}" target="_blank" rel="noopener noreferrer">${lang==='en'?'Live demo ↗':'تجربة المشروع ↗'}</a>`:''}</div></article>`).join('')}</div>`:`<div class="empty-projects"><div class="empty-icon">↗</div><div><h3>${t.emptyTitle}</h3><p>${t.emptyDesc}</p><p style="margin-top:10px">${t.emptyHint}</p></div></div>`}</div></section>
 <section id="contact"><div class="wrap reveal"><div class="contact-panel"><div><h2>${t.contactTitle}</h2><p>${t.contactDesc}</p></div><div class="contact-links">${SITE.contacts.map((c,i)=>`<a class="btn ${i===0?'primary':''}" href="${esc(c.url)}" ${c.url.startsWith('http')?'target="_blank" rel="noopener noreferrer"':''}>${esc(c.label)} ↗</a>`).join('')}</div></div></div></section>`;
 document.getElementById('copyright').textContent=t.copyright;document.querySelectorAll('[data-i18n="backtop"]').forEach(el=>el.textContent=t.backtop);setupReveal();
}
function setupReveal(){const items=document.querySelectorAll('.reveal');if(!('IntersectionObserver'in window)){items.forEach(x=>x.classList.add('visible'));return}const observer=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');observer.unobserve(e.target)}}),{threshold:.08});items.forEach(x=>observer.observe(x))}
document.getElementById('langBtn').addEventListener('click',()=>{lang=lang==='en'?'ar':'en';try{localStorage.setItem('portfolio-language',lang)}catch(e){}render()});render();
</script>
</body>
